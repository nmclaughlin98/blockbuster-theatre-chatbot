name: 1. Build and Test

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Check TypeScript Compilation
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Synthesize CDK App
        run: npm run synth -- --output cdk-out
